[tox]
minversion = 2.5.0
envlist = py-{format,lint,unit,ty}
skip_missing_interpreters = True

[testenv]

description =
    format: Check code formatting
    lint: Lint with ruff
    unit: Run unit tests
    ty: Check typing with ty

commands =
    format: ruff format --check
    lint: ruff check
    unit: pytest tests/
    ty: ty check

deps =
    format: ruff
    lint: ruff
    unit: pytest
    ty: ty
    ty: pytest
