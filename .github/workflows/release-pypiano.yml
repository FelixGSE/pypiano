name: release-pypiano

on:
  push:
    tags:
      - v*

jobs:
  tests:
    name: Run tests and check code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # No LFS: the tests mock fluidsynth and do not need the sound font
      - uses: actions/checkout@v7
      - name: Install fluidsynth
        # mingus loads libfluidsynth when it is imported
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfluidsynth3
      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the project
        run: uv sync --locked
      - name: Check formatting, lint and types
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run ty check
      - name: Run tests with coverage
        run: make coverage
  make-github-release:
    name: Create Release on Github
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
  make-pypi-release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        lfs: true
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install dependencies for pypi release
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        python setup.py sdist bdist_wheel
        twine upload dist/*
