name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Keeps a release PR open that bumps the version and CHANGELOG.md from the conventional PR titles merged since the
      # last release. Merging it tags the release and creates the GitHub release.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A personal access token: pull requests opened with GITHUB_TOKEN would not trigger CI
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tests:
    name: Lint and test
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and attach to the GitHub release
    needs: [release-please, tests]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance (gh attestation verify)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Build the sdist and wheel
        run: uv build
      # Signs which repository, commit and workflow built these files, so users can check with
      # gh attestation verify <file> --repo FelixGSE/pypiano
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            pypiano/sound_fonts/FluidR3_GM_pianos.sf2
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build]
    # Off until the repository variable PUBLISH_TO_PYPI is set to true (the bundled sound font is too large for PyPI)
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI accepts this workflow's OIDC token instead of an API token
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Publish
        run: uv publish --trusted-publishing always dist/*
