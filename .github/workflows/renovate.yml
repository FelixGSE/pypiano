name: renovate

on:
  schedule:
    # Weekly, inside renovate.json's "before 6am on monday" window; run it from the Actions tab to act on ticked
    # dependency dashboard checkboxes in between
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what Renovate would do, without creating branches or PRs
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          # Fine-grained PAT for this repository, see renovate.json for what it updates
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # Commit as the token's owner instead of Renovate's default address, which belongs to Mend
          RENOVATE_GIT_AUTHOR: "Renovate Bot <15325844+FelixGSE@users.noreply.github.com>"
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.dry-run && 'debug' || 'info' }}
