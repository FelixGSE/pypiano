name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        # The ty hook runs from the project environment through uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run the hooks
        uses: j178/prek-action@v3.0.0
        env:
          # These two run from binaries in the devcontainer image; they get their own steps below
          SKIP: hadolint,dprint
        with:
          # Same versions as in .devcontainer/Dockerfile
          prek-version: 0.5.4
      - name: Lint the Dockerfile
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo hadolint/hadolint:v2.15.1-debian hadolint .devcontainer/Dockerfile
      - name: Check Dockerfile formatting
        uses: dprint/check@v2.5
        with:
          dprint-version: 0.58.0

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install fluidsynth
        # mingus loads libfluidsynth when it is imported
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfluidsynth3
      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the project
        env:
          # Use uv's Python builds like the devcontainer, not whatever the runner has installed
          UV_PYTHON_PREFERENCE: only-managed
        run: uv sync --locked
      - name: Run the tests with coverage
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: make coverage

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fluidsynth
        # mingus loads libfluidsynth when it is imported
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfluidsynth3
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run all tests with the oldest allowed dependencies on the oldest Python
        env:
          UV_PYTHON_PREFERENCE: only-managed
        # Keeps the minimum versions in pyproject.toml true; installs into a throwaway venv, not from uv.lock
        run: make test-lowest

  package:
    name: Built package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install fluidsynth
        # The check records a note with the installed wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfluidsynth3
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Build the package and check the installed wheel
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: make test-package

  integration:
    name: Integration (real audio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fluidsynth
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfluidsynth3
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the project
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv sync --locked
      - name: Run the integration tests
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: make test-integration

  sound-font:
    name: Sound font is reproducible
    runs-on: ubuntu-latest
    env:
      PYPIANO_ARCHIVE_CACHE: ${{ github.workspace }}/.archive-cache
    steps:
      - uses: actions/checkout@v7
      - name: Install sf2-cutter
        # Same version and checksum as SF2_CUTTER_* in .devcontainer/Dockerfile
        env:
          SF2_CUTTER_VERSION: "0.1.0"
          SF2_CUTTER_SHA256: 9d67b219dd3839229a27232df48148b6de7dfd3ef791921e06d69e627974db06
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sf2-cutter.tar.gz" \
            "https://github.com/FelixGSE/sf2-cutter/releases/download/v$SF2_CUTTER_VERSION/sf2-cutter-x86_64-unknown-linux-musl.tar.gz"
          echo "$SF2_CUTTER_SHA256  $RUNNER_TEMP/sf2-cutter.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/sf2-cutter.tar.gz" -C /usr/local/bin sf2-cutter
          sf2-cutter --version
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the project
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv sync --locked
      - name: Restore Debian's fluid-soundfont archive
        uses: actions/cache@v6
        with:
          path: ${{ env.PYPIANO_ARCHIVE_CACHE }}
          # The script verifies the archive against Debian's checksum, cached or not
          key: fluid-soundfont-3.1-${{ hashFiles('scripts/build_sound_font.py') }}
          restore-keys: fluid-soundfont-3.1-
      - name: Rebuild the sound font and compare it with the bundled file
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: make soundfont-check

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fluidsynth
        # mingus loads libfluidsynth when it is imported
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfluidsynth3
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the project
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv sync --locked
      - name: Run mutation testing
        env:
          UV_PYTHON_PREFERENCE: only-managed
        # Fails below MUTATION_MIN (Makefile) and prints the diff of every mutant the tests did not catch
        run: make mutation
