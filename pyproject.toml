[project]
name = "pypiano"
version = "0.1.0"
description = "Library to programmatically play piano"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "FelixGSE" }]
requires-python = ">=3.11"
dependencies = [
    "mingus>=0.6.1",
    # Imported by mingus.midi.pyfluidsynth, which does not declare it
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/FelixGSE/pypiano"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "tox>=4.64.7",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
