[project]
name = "pypiano"
version = "0.1.0"
description = "Library to programmatically play piano"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "licenses/*"]
keywords = ["piano", "music", "midi", "fluidsynth", "mingus", "sound font", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Typing :: Typed",
]
authors = [{ name = "FelixGSE" }]
requires-python = ">=3.11"
dependencies = [
    "mingus>=0.6.1",
    # Imported by mingus.midi.pyfluidsynth, which does not declare it
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/FelixGSE/pypiano"
Source = "https://github.com/FelixGSE/pypiano"
Issues = "https://github.com/FelixGSE/pypiano/issues"
Changelog = "https://github.com/FelixGSE/pypiano/blob/HEAD/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "ruff>=0.16.10",
    "tqdm>=4.70.1",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with the formatter
    "COM812",
    # The project is licensed via LICENSE, not per-file headers
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Also flag sibling imports (from . import x); the default only bans parent imports
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["INP001"] # standalone scripts, not a package
"tests/**" = [
    "D",       # test names describe the test
    "PLR2004", # expected values in assertions
    "S101",    # pytest uses assert
    "SLF001",  # tests check private state
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pypiano"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
