[project]
name = "pypiano"
version = "0.1.2"
description = "Library to programmatically play piano"
readme = "README.md"
# The code is GPL; the bundled sound font, a subset of FluidR3_GM, is MIT (licenses/LICENSE-FluidR3_GM_sf2.txt)
license = "GPL-3.0-or-later AND MIT"
license-files = ["LICENSE", "licenses/*"]
keywords = ["piano", "music", "midi", "fluidsynth", "mingus", "sound font", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Typing :: Typed",
]
authors = [{ name = "FelixGSE" }]
requires-python = ">=3.11"
# Minimum versions are the oldest that work, checked by make test-lowest (CI job "Lowest dependencies")
dependencies = [
    # 0.6.1 fixes Python 3 integer division bugs in the notes and containers PyPiano uses
    "mingus>=0.6.1",
    # Used by mingus.midi.pyfluidsynth, which doesn't declare it, and by PyPiano's patches of it (_mingus_compat).
    # 1.23.2 is the oldest numpy with wheels for Python 3.11
    "numpy>=1.23.2",
]

[project.urls]
Homepage = "https://github.com/FelixGSE/pypiano"
Source = "https://github.com/FelixGSE/pypiano"
Issues = "https://github.com/FelixGSE/pypiano/issues"
Changelog = "https://github.com/FelixGSE/pypiano/blob/HEAD/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "ruff>=0.16.10",
    "tqdm>=4.70.1",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with the formatter
    "COM812",
    # The project is licensed via LICENSE, not per-file headers
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Also flag sibling imports (from . import x); the default only bans parent imports
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["INP001"] # standalone scripts, not a package
"tests/**" = [
    "D",       # test names describe the test
    "PLR2004", # expected values in assertions
    "S101",    # pytest uses assert
    "SLF001",  # tests check private state
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests play real audio; run them with make test-integration
addopts = ["-m", "not integration", "--strict-markers"]
markers = ["integration: needs libfluidsynth, plays real audio"]

[tool.coverage.run]
source = ["pypiano"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mutmut]
source_paths = ["pypiano/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Tests load these scripts from the repository root
also_copy = ["scripts/"]
